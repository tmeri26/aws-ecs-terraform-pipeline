name: Deploy Static Website to S3

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggering

# Required permissions for keyless OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Upgraded to v4

      # Update deployment timestamp
      - name: Update deployment timestamp
        run: |
          echo "// Updating timestamp for deployment on $(date)" >> js/script.js
          echo "// Deployment ID: ${{ github.run_id }}" >> js/script.js

      # OIDC Authentication
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.arn:aws:iam::277361136766:role/github-actions-role }}
          role-session-name: GitHubActions-S3-Deploy-${{ github.run_id }}
          aws-region: "us-east-1"

      # Deploy to S3 bucket securely
      - name: Deploy to S3
        run: |
          aws s3 sync ./ s3://${{ secrets.my-static-website-bucket-123 }}/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude "*.json" \
            --exclude ".gitignore"
