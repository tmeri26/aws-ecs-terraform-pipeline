name: AWS OIDC Deployment

on:
  push:
    branches:
      - main

# Required permissions for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  aws-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::277361136766:role/github-actions-role # Replace with your copied IAM Role ARN
          aws-region: us-east-1 # Replace with your target AWS region

      - name: Verify AWS Identity
        run: aws sts get-caller-identity
